name: Sign Windows release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub release tag whose Windows EXE should be signed
        required: true
        default: v1.0.0
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  sign-and-publish:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows app
        run: |
          npm run package
          npx electron-builder --win portable --x64 --config scripts/windows-signing.cjs --publish never

      - name: Sign in to Microsoft Artifact Signing
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign Windows app and launcher
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files: |
            ${{ github.workspace }}\desktop-release\win-unpacked\AAC Heatmap.exe
            ${{ github.workspace }}\desktop-release\AAC-Heatmap-1.0.0-win-x64.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify both publisher signatures
        shell: pwsh
        run: |
          $files = @(
            'desktop-release/win-unpacked/AAC Heatmap.exe',
            'desktop-release/AAC-Heatmap-1.0.0-win-x64.exe'
          )
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature $file
            if ($signature.Status -ne 'Valid') {
              throw "Signature check failed for $file`: $($signature.Status) — $($signature.StatusMessage)"
            }
            Write-Host "$file signed by $($signature.SignerCertificate.Subject)"
          }

      - name: Replace Windows download on GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $assets = @(Get-ChildItem 'desktop-release/AAC-Heatmap-*-win-x64.exe')
          if ($assets.Count -ne 1) { throw "Expected one Windows release EXE; found $($assets.Count)." }
          gh release upload $env:RELEASE_TAG $assets[0].FullName --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Upload of the signed Windows EXE failed.' }
